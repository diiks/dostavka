<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ДОСТАВКА">
    <link rel="manifest" href="data:application/json,{'name':'ДОСТАВКА','short_name':'ДОСТАВКА','display':'standalone','start_url':'.','background_color':'#0a0a0a','theme_color':'#6c00ff'}">
    <title>ДОСТАВКА</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app-container {
            max-width: 520px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 36px;
            box-shadow: 0 25px 50px rgba(108, 0, 255, 0.3), 0 0 80px rgba(108, 0, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .app-header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: white;
            padding: 22px 20px 18px;
            text-align: center;
            border-bottom: 1px solid rgba(108, 0, 255, 0.3);
        }

        .app-header h2 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            margin-bottom: 16px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(108, 0, 255, 0.5);
        }

        .date-navigator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(108, 0, 255, 0.15);
            border-radius: 40px;
            padding: 6px 10px;
            flex-wrap: wrap;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .nav-btn {
            background: rgba(108, 0, 255, 0.3);
            border: none;
            color: #e0b0ff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(108, 0, 255, 0.3);
        }

        .nav-btn:active {
            transform: scale(0.94);
        }

        .date-display {
            background: #1a1a2e;
            color: #e0b0ff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 1rem;
            min-width: 130px;
            text-align: center;
            border: 1px solid rgba(108, 0, 255, 0.4);
            cursor: pointer;
        }

        .search-date-row {
            display: flex;
            margin-top: 12px;
            gap: 6px;
            justify-content: center;
        }

        .search-input {
            border: 1px solid rgba(108, 0, 255, 0.4);
            border-radius: 30px;
            padding: 10px 16px;
            font-size: 0.9rem;
            width: 150px;
            background: #1a1a2e;
            color: #e0b0ff;
            text-align: center;
        }

        .search-input::placeholder {
            color: rgba(224, 176, 255, 0.5);
        }

        .search-btn {
            background: linear-gradient(135deg, #6c00ff, #00ffff);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .today-btn {
            background: rgba(108, 0, 255, 0.3);
            border: 1px solid rgba(108, 0, 255, 0.4);
            border-radius: 30px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            color: #e0b0ff;
        }

        .totals-container {
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            background: rgba(15, 15, 26, 0.8);
            margin: 8px 12px 0;
            border-radius: 20px;
            gap: 5px;
            border: 1px solid rgba(108, 0, 255, 0.2);
        }

        .total-box {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 16px;
            padding: 10px 6px;
            box-shadow: 0 0 20px rgba(108, 0, 255, 0.2);
            flex: 1;
            min-width: 90px;
            text-align: center;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .total-label {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: #00ffff;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .total-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(108, 0, 255, 0.6);
        }

        .table-wrapper {
            padding: 10px 8px 20px;
            background: #0f0f1a;
            max-height: 450px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a2e;
            border-radius: 20px;
            table-layout: fixed;
        }

        th {
            background: #0f0f1a;
            font-weight: 600;
            color: #00ffff;
            padding: 14px 2px;
            font-size: 0.7rem;
            border-bottom: 2px solid rgba(108, 0, 255, 0.4);
        }

        td {
            border-bottom: 1px solid rgba(108, 0, 255, 0.2);
            height: 42px;
            text-align: center;
            background: #1a1a2e;
            padding: 2px;
        }

        .row-number {
            font-weight: 600;
            color: #6c00ff;
            background: #0f0f1a;
            font-size: 0.8rem;
        }

        .heart-cell {
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 42px;
            border-radius: 8px;
            margin: 2px;
            opacity: 0.25;
            filter: grayscale(30%);
            transition: 0.3s;
        }

        .heart-cell:active {
            transform: scale(0.9);
        }

        .heart-cell.active {
            opacity: 1;
            filter: grayscale(0%) drop-shadow(0 0 8px rgba(108, 0, 255, 0.8));
            animation: neonPulse 1.5s ease-in-out infinite;
        }

        @keyframes neonPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(108, 0, 255, 0.8)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.9)); }
        }

        input {
            width: 100%;
            height: 36px;
            border: 1px solid rgba(108, 0, 255, 0.3);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            background: #0f0f1a;
            color: #ffffff;
            padding: 2px;
        }

        input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .footer-note {
            text-align: center;
            padding: 14px;
            color: rgba(224, 176, 255, 0.6);
            font-size: 0.8rem;
            background: #0f0f1a;
            border-top: 1px solid rgba(108, 0, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
        }

        .sync-now-btn {
            background: linear-gradient(135deg, #6c00ff, #00ffff);
            border: none;
            color: white;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .sync-indicator {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: 0.3s;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .sync-indicator.show {
            opacity: 1;
        }

        .sync-indicator.error {
            background: #ff9800;
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
        }

        .sound-toggle {
            background: rgba(108, 0, 255, 0.3);
            border: 1px solid rgba(108, 0, 255, 0.4);
            color: #e0b0ff;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="sync-indicator" id="syncStatus">☁️ Синхронизировано</div>

<div class="app-container">
    <div class="app-header">
        <h2>😊💰💲💵❤️</h2>
        <div class="date-navigator">
            <button class="nav-btn" id="prevDayBtn">←</button>
            <span class="date-display" id="currentDateDisplay">---</span>
            <button class="nav-btn" id="nextDayBtn">→</button>
        </div>
        <div class="search-date-row">
            <input type="text" class="search-input" id="searchDateInput" placeholder="дд.мм.гггг" />
            <button class="search-btn" id="searchDateBtn">🔍</button>
            <button class="today-btn" id="todayBtn">Сегодня</button>
        </div>
    </div>

    <div class="totals-container">
        <div class="total-box">
            <div class="total-label">💰 Итог</div>
            <div class="total-value" id="totalMain">0</div>
        </div>
        <div class="total-box">
            <div class="total-label">KM🛣️</div>
            <div class="total-value" id="totalCol5">0</div>
        </div>
        <div class="total-box">
            <div class="total-label">КГ🛍</div>
            <div class="total-value" id="totalCol6">0</div>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>№</th>
                <th>💸1</th>
                <th>🪙2</th>
                <th>💲3</th>
                <th>💰4</th>
                <th>🚘</th>
                <th>🗿</th>
                <th>🫧</th>
            </tr>
            </thead>
            <tbody id="rowsBody"></tbody>
        </table>
    </div>
    <div class="footer-note">
        <span>🔄 Каждые 5 мин</span>
        <div style="display:flex;gap:8px;">
            <button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>
            <button class="sync-now-btn" onclick="syncNow()">Синхр. сейчас</button>
        </div>
    </div>
</div>

<script>
const JSONBIN_BIN_ID = '6a750d49da38895dfec37959';
const JSONBIN_API_KEY = '$2a$10$Aaqly4jYya2FH7JO0vhA9OsX0D1ufyWm1QZCTAQty6OQzyvdDcPfO';

let currentDateStr = '';
let allData = {};
let localChanges = false;
let soundEnabled = true;

// Создаём аудио-контекст для звуков
let audioContext = null;

function getAudioContext() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioContext;
}

// Звук активации (приятный "дзинь")
function playActivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, ctx.currentTime); // Ля 2-й октавы
        oscillator.frequency.setValueAtTime(1100, ctx.currentTime + 0.1); // До-диез
        
        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.3);
    } catch(e) {
        // Без звука если ошибка
    }
}

// Звук деактивации (низкий "тук")
function playDeactivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, ctx.currentTime);
        oscillator.frequency.setValueAtTime(330, ctx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        
        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + 0.3);
    } catch(e) {
        // Без звука если ошибка
    }
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggle');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
}

function showSync(message, isError = false) {
    const el = document.getElementById('syncStatus');
    el.textContent = message;
    el.className = 'sync-indicator ' + (isError ? 'error' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
}

async function loadFromCloud() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const result = await response.json();
        allData = result.record || {};
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        return allData;
    } catch (e) {
        const local = localStorage.getItem('deliveryCloudData');
        if (local) allData = JSON.parse(local);
        return allData;
    }
}

async function saveToCloud() {
    if (!localChanges) return;
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': JSONBIN_API_KEY
            },
            body: JSON.stringify(allData)
        });
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        showSync('☁️ Синхронизировано');
    } catch (e) {
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        showSync('📱 Офлайн — сохранено локально', true);
    }
}

function saveCellLocal(dateStr, row, col, value) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr][row]) allData[dateStr][row] = {};
    allData[dateStr][row][col] = value;
    localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
    localChanges = true;
}

function getCell(dateStr, row, col) {
    if (allData[dateStr] && allData[dateStr][row]) {
        return allData[dateStr][row][col] || '';
    }
    return '';
}

function formatDate(date) {
    return `${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}`;
}

function getToday() { return formatDate(new Date()); }

function shiftDate(ds, off) {
    const p = ds.split('.');
    const d = new Date(+p[2], +p[1]-1, +p[0]);
    d.setDate(d.getDate() + off);
    return formatDate(d);
}

function prevDay() { goToDate(shiftDate(currentDateStr, -1)); }
function nextDay() { goToDate(shiftDate(currentDateStr, 1)); }
function goToday() { goToDate(getToday()); }

function searchDate() {
    const v = document.getElementById('searchDateInput').value.trim();
    if (v && /^\d{2}\.\d{2}\.\d{4}$/.test(v)) goToDate(v);
    else alert('Формат: дд.мм.гггг');
}

function updateTotals() {
    let main = 0, c5 = 0, c6 = 0;
    
    document.querySelectorAll('.heart-cell').forEach(cell => {
        if (cell.classList.contains('active')) {
            main += +cell.dataset.col === 1 ? 155 : 85;
        }
    });

    document.querySelectorAll('input[data-col]').forEach(inp => {
        const col = +inp.dataset.col;
        const v = parseFloat(inp.value.replace(',','.')) || 0;
        if (col === 5) { c5 += v; main += v * 13; }
        else if (col === 6) { c6 += v; main += v * 2; }
        else if (col === 7) { main += v; }
    });

    document.getElementById('totalMain').textContent = main;
    document.getElementById('totalCol5').textContent = c5;
    document.getElementById('totalCol6').textContent = c6;
}

function renderTable(dateStr) {
    document.getElementById('currentDateDisplay').textContent = dateStr;
    document.getElementById('searchDateInput').value = dateStr;
    
    let h = '';
    for (let i = 1; i <= 100; i++) {
        const a1 = getCell(dateStr, i, 1) === '1';
        const a2 = getCell(dateStr, i, 2) === '1';
        const a3 = getCell(dateStr, i, 3) === '1';
        const a4 = getCell(dateStr, i, 4) === '1';
        const v5 = getCell(dateStr, i, 5).replace(/"/g,'&quot;');
        const v6 = getCell(dateStr, i, 6).replace(/"/g,'&quot;');
        const v7 = getCell(dateStr, i, 7).replace(/"/g,'&quot;');

        h += `<tr>
            <td class="row-number">${i}</td>
            <td><div class="heart-cell${a1?' active':''}" data-row="${i}" data-col="1">💵</div></td>
            <td><div class="heart-cell${a2?' active':''}" data-row="${i}" data-col="2">💷</div></td>
            <td><div class="heart-cell${a3?' active':''}" data-row="${i}" data-col="3">💴</div></td>
            <td><div class="heart-cell${a4?' active':''}" data-row="${i}" data-col="4">💶</div></td>
            <td><input data-row="${i}" data-col="5" value="${v5}" placeholder="0"></td>
            <td><input data-row="${i}" data-col="6" value="${v6}" placeholder="0"></td>
            <td><input data-row="${i}" data-col="7" value="${v7}" placeholder="0"></td>
        </tr>`;
    }

    document.getElementById('rowsBody').innerHTML = h;

    document.querySelectorAll('.heart-cell').forEach(cell => {
        cell.onclick = () => {
            const isActive = cell.classList.contains('active');
            
            if (isActive) {
                // Деактивация
                cell.classList.remove('active');
                saveCellLocal(dateStr, cell.dataset.row, cell.dataset.col, '0');
                playDeactivateSound();
            } else {
                // Активация
                cell.classList.add('active');
                saveCellLocal(dateStr, cell.dataset.row, cell.dataset.col, '1');
                playActivateSound();
            }
            
            updateTotals();
        };
    });

    document.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => {
            saveCellLocal(dateStr, inp.dataset.row, inp.dataset.col, inp.value);
            updateTotals();
        };
    });

    updateTotals();
}

async function goToDate(ds) {
    await saveToCloud();
    currentDateStr = ds;
    await loadFromCloud();
    renderTable(ds);
}

async function syncNow() {
    showSync('🔄 Синхронизация...');
    await saveToCloud();
    await loadFromCloud();
    if (currentDateStr) renderTable(currentDateStr);
}

(async function init() {
    await loadFromCloud();
    
    const today = getToday();
    currentDateStr = today;
    renderTable(today);
    
    // Автосинхронизация раз в 5 минут (300 000 мс)
    setInterval(async () => {
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    }, 300000);
    
    document.getElementById('prevDayBtn').onclick = prevDay;
    document.getElementById('nextDayBtn').onclick = nextDay;
    document.getElementById('todayBtn').onclick = goToday;
    document.getElementById('searchDateBtn').onclick = searchDate;
    document.getElementById('searchDateInput').onkeypress = e => {
        if (e.key === 'Enter') searchDate();
    };
    document.getElementById('currentDateDisplay').onclick = () => {
        document.getElementById('searchDateInput').focus();
    };
    
    window.addEventListener('beforeunload', () => {
        saveToCloud();
    });
    
    window.addEventListener('online', async () => {
        showSync('🌐 Онлайн — синхронизируем...');
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    });
    
    window.addEventListener('offline', () => {
        showSync('📱 Офлайн-режим', true);
    });
})();
</script>
</body>
</html>

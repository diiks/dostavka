<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ДОСТАВКА">
    <link rel="manifest" href="data:application/json,{'name':'ДОСТАВКА','short_name':'ДОСТАВКА','display':'standalone','start_url':'.','background_color':'#0a0a0a','theme_color':'#6c00ff'}">
    <title>ДОСТАВКА</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .app-container {
            max-width: 520px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 36px;
            box-shadow: 0 25px 50px rgba(108, 0, 255, 0.3), 0 0 80px rgba(108, 0, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .app-header {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: white;
            padding: 22px 20px 18px;
            text-align: center;
            border-bottom: 1px solid rgba(108, 0, 255, 0.3);
        }

        .app-header h2 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.3px;
            margin-bottom: 16px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(108, 0, 255, 0.5);
        }

        .date-navigator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(108, 0, 255, 0.15);
            border-radius: 40px;
            padding: 6px 10px;
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .nav-btn {
            background: rgba(108, 0, 255, 0.3);
            border: none;
            color: #e0b0ff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(108, 0, 255, 0.3);
            line-height: 1;
        }

        .nav-btn:hover {
            background: rgba(108, 0, 255, 0.5);
            box-shadow: 0 0 25px rgba(108, 0, 255, 0.6);
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: scale(0.94);
        }

        .date-display {
            background: #1a1a2e;
            color: #e0b0ff;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 1rem;
            min-width: 130px;
            text-align: center;
            box-shadow: 0 0 15px rgba(108, 0, 255, 0.3), inset 0 1px 4px rgba(0,0,0,0.5);
            border: 1px solid rgba(108, 0, 255, 0.4);
            outline: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .date-display:focus {
            outline: 2px solid #00ffff;
            outline-offset: 2px;
        }

        .search-date-row {
            display: flex;
            margin-top: 12px;
            gap: 6px;
            justify-content: center;
        }

        .search-input {
            border: 1px solid rgba(108, 0, 255, 0.4);
            border-radius: 30px;
            padding: 10px 16px;
            font-size: 0.9rem;
            width: 150px;
            background: #1a1a2e;
            color: #e0b0ff;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 0 10px rgba(108, 0, 255, 0.2);
        }

        .search-input::placeholder {
            color: rgba(224, 176, 255, 0.5);
        }

        .search-btn {
            background: linear-gradient(135deg, #6c00ff, #00ffff);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .search-btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
            transform: scale(1.05);
        }

        .today-btn {
            background: rgba(108, 0, 255, 0.3);
            border: 1px solid rgba(108, 0, 255, 0.4);
            border-radius: 30px;
            padding: 10px 16px;
            font-weight: 600;
            cursor: pointer;
            color: #e0b0ff;
            transition: 0.3s;
        }

        .today-btn:hover {
            background: rgba(108, 0, 255, 0.5);
            box-shadow: 0 0 15px rgba(108, 0, 255, 0.5);
        }

        /* итоги */
        .totals-container {
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            background: rgba(15, 15, 26, 0.8);
            margin: 8px 12px 0;
            border-radius: 20px;
            gap: 5px;
            flex-wrap: wrap;
            border: 1px solid rgba(108, 0, 255, 0.2);
        }

        .total-box {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 16px;
            padding: 10px 6px;
            box-shadow: 0 0 20px rgba(108, 0, 255, 0.2);
            flex: 1;
            min-width: 90px;
            text-align: center;
            border: 1px solid rgba(108, 0, 255, 0.3);
        }

        .total-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00ffff;
            margin-bottom: 4px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .total-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 0 15px rgba(108, 0, 255, 0.6);
        }

        .table-wrapper {
            padding: 10px 8px 20px;
            background: #0f0f1a;
            max-height: 450px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a2e;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(108, 0, 255, 0.2);
            table-layout: fixed;
        }

        th {
            background: #0f0f1a;
            font-weight: 600;
            color: #00ffff;
            padding: 14px 2px;
            font-size: 0.7rem;
            border-bottom: 2px solid rgba(108, 0, 255, 0.4);
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        td {
            border-bottom: 1px solid rgba(108, 0, 255, 0.2);
            height: 42px;
            text-align: center;
            vertical-align: middle;
            background: #1a1a2e;
            padding: 2px;
        }

        tr:hover td {
            background: rgba(108, 0, 255, 0.05);
        }

        .row-number {
            font-weight: 600;
            color: #6c00ff;
            background: #0f0f1a;
            font-size: 0.8rem;
            width: 30px;
            text-shadow: 0 0 5px rgba(108, 0, 255, 0.5);
        }

        /* квадратные ячейки для колонок 1-4 */
        .heart-cell {
            cursor: pointer;
            user-select: none;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 42px;
            transition: 0.3s;
            border-radius: 8px;
            margin: 2px;
            opacity: 0.25;
            filter: grayscale(30%);
        }

        .heart-cell:hover {
            opacity: 0.5;
            background: rgba(108, 0, 255, 0.15);
        }

        .heart-cell:active {
            transform: scale(0.9);
        }

        .heart-cell.active {
            opacity: 1;
            filter: grayscale(0%) drop-shadow(0 0 8px rgba(108, 0, 255, 0.8));
            animation: neonPulse 1.5s ease-in-out infinite;
        }

        @keyframes neonPulse {
            0%, 100% { filter: grayscale(0%) drop-shadow(0 0 8px rgba(108, 0, 255, 0.8)); }
            50% { filter: grayscale(0%) drop-shadow(0 0 15px rgba(0, 255, 255, 0.9)); }
        }

        /* поля ввода */
        input {
            width: 100%;
            height: 36px;
            border: 1px solid rgba(108, 0, 255, 0.3);
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            background: #0f0f1a;
            transition: all 0.3s;
            padding: 2px;
            color: #ffffff;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        input:focus {
            outline: none;
            border-color: #00ffff;
            background: #1a1a2e;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .footer-note {
            text-align: center;
            padding: 14px;
            color: rgba(224, 176, 255, 0.6);
            font-size: 0.8rem;
            background: #0f0f1a;
            border-top: 1px solid rgba(108, 0, 255, 0.3);
        }

        .offline-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* скроллбар */
        .table-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #0f0f1a;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #6c00ff;
            border-radius: 4px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <h2>😊💰💲💵❤️</h2>
        <div class="date-navigator">
            <button class="nav-btn" id="prevDayBtn" title="Предыдущий день">←</button>
            <span class="date-display" id="currentDateDisplay">---</span>
            <button class="nav-btn" id="nextDayBtn" title="Следующий день">→</button>
        </div>
        <div class="search-date-row">
            <input type="text" class="search-input" id="searchDateInput" placeholder="дд.мм.гггг" />
            <button class="search-btn" id="searchDateBtn">🔍 Найти</button>
            <button class="today-btn" id="todayBtn">Сегодня</button>
        </div>
    </div>

    <!-- 3 итоговых окна -->
    <div class="totals-container">
        <div class="total-box">
            <div class="total-label">💰 Итог</div>
            <div class="total-value" id="totalMain">0</div>
        </div>
        <div class="total-box">
            <div class="total-label">KM🛣️</div>
            <div class="total-value" id="totalCol5">0</div>
        </div>
        <div class="total-box">
            <div class="total-label">КГ🛍</div>
            <div class="total-value" id="totalCol6">0</div>
        </div>
    </div>

    <div class="table-wrapper" id="tableContainer">
        <table>
            <thead>
            <tr>
                <th>№</th>
                <th>💸1</th>
                <th>🪙2</th>
                <th>💲3</th>
                <th>💰4</th>
                <th>🚘</th>
                <th>🗿</th>
                <th>🫧</th>
            </tr>
            </thead>
            <tbody id="rowsBody">
            </tbody>
        </table>
    </div>
    <div class="footer-note">
        📱 Офлайн-режим <span class="offline-badge" id="offlineStatus">ОНЛАЙН</span>
    </div>
</div>

<script>
// ========== SERVICE WORKER ДЛЯ ОФЛАЙН ==========
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        // Создаём service worker из кода
        const swCode = `
            const CACHE_NAME = 'dostavka-v1';
            const ASSETS = [
                '/dostavka/',
                '/dostavka/index.html'
            ];

            self.addEventListener('install', (event) => {
                event.waitUntil(
                    caches.open(CACHE_NAME).then((cache) => {
                        return cache.addAll(ASSETS);
                    })
                );
            });

            self.addEventListener('fetch', (event) => {
                event.respondWith(
                    caches.match(event.request).then((cachedResponse) => {
                        return cachedResponse || fetch(event.request).then((response) => {
                            return caches.open(CACHE_NAME).then((cache) => {
                                cache.put(event.request, response.clone());
                                return response;
                            });
                        });
                    })
                );
            });

            self.addEventListener('activate', (event) => {
                event.waitUntil(
                    caches.keys().then((cacheNames) => {
                        return Promise.all(
                            cacheNames.map((cacheName) => {
                                if (cacheName !== CACHE_NAME) {
                                    return caches.delete(cacheName);
                                }
                            })
                        );
                    })
                );
            });
        `;

        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl).then(() => {
            console.log('Service Worker зарегистрирован');
        }).catch((error) => {
            console.log('Service Worker не поддерживается в этом режиме');
        });
    });
}

// ========== ОСНОВНОЙ КОД ==========
(function() {
    if (!window.indexedDB) {
        document.getElementById('rowsBody').innerHTML = 
            '<tr><td colspan="7"><div style="padding:30px;color:#ff4444;">❌ Браузер не поддерживает IndexedDB</div></td></tr>';
        return;
    }

    let currentDateStr = '';
    let db = null;

    // Определяем онлайн/офлайн статус
    function updateOnlineStatus() {
        const statusEl = document.getElementById('offlineStatus');
        if (navigator.onLine) {
            statusEl.textContent = 'ОНЛАЙН';
            statusEl.style.background = '#4CAF50';
        } else {
            statusEl.textContent = 'ОФЛАЙН';
            statusEl.style.background = '#ff9800';
        }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    function formatDateRU(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}.${month}.${year}`;
    }

    function parseDateFromRU(str) {
        const parts = str.split('.');
        if (parts.length !== 3) return null;
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        const date = new Date(year, month, day);
        if (date.getFullYear() === year && date.getMonth() === month && date.getDate() === day) {
            return date;
        }
        return null;
    }

    function getTodayString() {
        return formatDateRU(new Date());
    }

    function shiftDate(dateStr, offsetDays) {
        const date = parseDateFromRU(dateStr);
        if (!date) return dateStr;
        date.setDate(date.getDate() + offsetDays);
        return formatDateRU(date);
    }

    function openDatabase() {
        return new Promise((resolve, reject) => {
            try {
                const request = indexedDB.open('DiaryDB_v2', 1);
                
                request.onupgradeneeded = function(event) {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains('cells')) {
                        database.createObjectStore('cells', { keyPath: 'id' });
                    }
                };
                
                request.onsuccess = function(event) {
                    resolve(event.target.result);
                };
                
                request.onerror = function(event) {
                    reject(event.target.error);
                };
            } catch (error) {
                reject(error);
            }
        });
    }

    function saveCellToDB(id, value) {
        if (!db) return;
        try {
            const transaction = db.transaction('cells', 'readwrite');
            const store = transaction.objectStore('cells');
            store.put({ id: id, value: value });
        } catch (error) {
            console.warn('Ошибка сохранения:', error);
        }
    }

    function loadCellsForDate(dateStr) {
        return new Promise((resolve) => {
            if (!db) {
                resolve({});
                return;
            }
            try {
                const transaction = db.transaction('cells', 'readonly');
                const store = transaction.objectStore('cells');
                const dataMap = {};
                
                const request = store.openCursor();
                
                request.onsuccess = function(event) {
                    const cursor = event.target.result;
                    if (cursor) {
                        const record = cursor.value;
                        if (record.id && record.id.startsWith(dateStr + '_')) {
                            dataMap[record.id] = record.value;
                        }
                        cursor.continue();
                    } else {
                        resolve(dataMap);
                    }
                };
                
                request.onerror = function() {
                    resolve({});
                };
            } catch (error) {
                resolve({});
            }
        });
    }

    function updateAllTotals() {
        let totalMain = 0;
        let totalCol5 = 0;
        let totalCol6 = 0;

        const hearts = document.querySelectorAll('.heart-cell');
        hearts.forEach(cell => {
            const col = parseInt(cell.dataset.col);
            const isFilled = cell.classList.contains('active');
            
            if (isFilled) {
                if (col === 1) {
                    totalMain += 155;
                } else if (col >= 2 && col <= 4) {
                    totalMain += 85;
                }
            }
        });

        const inputs = document.querySelectorAll('#rowsBody input[data-col]');
        inputs.forEach(input => {
            const col = parseInt(input.dataset.col);
            const rawValue = input.value.trim();
            let num = parseFloat(rawValue.replace(',', '.'));
            if (isNaN(num)) num = 0;

            if (col === 5) {
                totalCol5 += num;
                totalMain += num * 13;
            } else if (col === 6) {
                totalCol6 += num;
                totalMain += num * 2;
            } else if (col === 7) {
                totalMain += num;
            }
        });

        document.getElementById('totalMain').textContent = totalMain;
        document.getElementById('totalCol5').textContent = totalCol5;
        document.getElementById('totalCol6').textContent = totalCol6;
    }

    async function renderTableForDate(dateStr) {
        const tbody = document.getElementById('rowsBody');
        if (!tbody) return;

        document.getElementById('currentDateDisplay').textContent = dateStr;
        
        let savedData = {};
        try {
            savedData = await loadCellsForDate(dateStr);
        } catch (error) {
            console.warn('Ошибка загрузки данных:', error);
        }

        let html = '';
        for (let i = 1; i <= 100; i++) {
            const heart1 = savedData[`${dateStr}_${i}_1`] || '0';
            const heart2 = savedData[`${dateStr}_${i}_2`] || '0';
            const heart3 = savedData[`${dateStr}_${i}_3`] || '0';
            const heart4 = savedData[`${dateStr}_${i}_4`] || '0';
            
            const val5 = (savedData[`${dateStr}_${i}_5`] || '').replace(/"/g, '&quot;');
            const val6 = (savedData[`${dateStr}_${i}_6`] || '').replace(/"/g, '&quot;');
            const val7 = (savedData[`${dateStr}_${i}_7`] || '').replace(/"/g, '&quot;');

            html += `
                <tr>
                    <td class="row-number">${i}</td>
                    <td>
                        <div class="heart-cell ${heart1 === '1' ? 'active' : ''}" 
                             data-row="${i}" data-col="1">
                            💵
                        </div>
                    </td>
                    <td>
                        <div class="heart-cell ${heart2 === '1' ? 'active' : ''}" 
                             data-row="${i}" data-col="2">
                            💷
                        </div>
                    </td>
                    <td>
                        <div class="heart-cell ${heart3 === '1' ? 'active' : ''}" 
                             data-row="${i}" data-col="3">
                            💴
                        </div>
                    </td>
                    <td>
                        <div class="heart-cell ${heart4 === '1' ? 'active' : ''}" 
                             data-row="${i}" data-col="4">
                            💶
                        </div>
                    </td>
                    <td><input type="text" data-row="${i}" data-col="5" value="${val5}" placeholder="0"></td>
                    <td><input type="text" data-row="${i}" data-col="6" value="${val6}" placeholder="0"></td>
                    <td><input type="text" data-row="${i}" data-col="7" value="${val7}" placeholder="0"></td>
                </tr>
            `;
        }

        tbody.innerHTML = html;

        document.querySelectorAll('.heart-cell').forEach(cell => {
            cell.addEventListener('click', function() {
                const row = this.dataset.row;
                const col = this.dataset.col;
                const id = `${dateStr}_${row}_${col}`;
                
                if (this.classList.contains('active')) {
                    this.classList.remove('active');
                    saveCellToDB(id, '0');
                } else {
                    this.classList.add('active');
                    saveCellToDB(id, '1');
                }
                
                updateAllTotals();
            });
        });

        document.querySelectorAll('#rowsBody input[data-col]').forEach(input => {
            input.addEventListener('input', function() {
                const row = this.dataset.row;
                const col = this.dataset.col;
                const id = `${dateStr}_${row}_${col}`;
                
                saveCellToDB(id, this.value);
                updateAllTotals();
            });
        });

        updateAllTotals();
    }

    async function goToDate(dateStr) {
        if (!parseDateFromRU(dateStr)) {
            alert('Неверный формат даты. Используйте дд.мм.гггг');
            return;
        }
        currentDateStr = dateStr;
        await renderTableForDate(dateStr);
        document.getElementById('searchDateInput').value = dateStr;
    }

    async function initApp() {
        try {
            db = await openDatabase();
        } catch (error) {
            console.error('Ошибка открытия БД:', error);
            document.getElementById('rowsBody').innerHTML = 
                '<tr><td colspan="7"><div style="padding:30px;color:#ff4444;">❌ Ошибка базы данных</div></td></tr>';
            return;
        }

        const todayStr = getTodayString();
        currentDateStr = todayStr;
        await renderTableForDate(todayStr);
        document.getElementById('searchDateInput').value = todayStr;

        document.getElementById('prevDayBtn').onclick = () => goToDate(shiftDate(currentDateStr, -1));
        document.getElementById('nextDayBtn').onclick = () => goToDate(shiftDate(currentDateStr, 1));
        document.getElementById('todayBtn').onclick = () => goToDate(getTodayString());
        
        document.getElementById('searchDateBtn').onclick = () => {
            const input = document.getElementById('searchDateInput').value.trim();
            if (input) goToDate(input);
            else alert('Введите дату');
        };

        document.getElementById('searchDateInput').onkeypress = (e) => {
            if (e.key === 'Enter') document.getElementById('searchDateBtn').click();
        };

        document.getElementById('currentDateDisplay').onclick = () => {
            document.getElementById('searchDateInput').focus();
        };
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }
})();
</script>

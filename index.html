<script>
const JSONBIN_BIN_ID = '6a750d49da38895dfec37959';
const JSONBIN_API_KEY = '$2a$10$Aaqly4jYya2FH7JO0vhA9OsX0D1ufyWm1QZCTAQty6OQzyvdDcPfO';

let currentDateStr = '';
let allData = {};
let localChanges = false;
let soundEnabled = true;
let isSwitching = false;
let previousTotals = { main: 0, col5: 0, col6: 0 };
let statsVisible = false;

let audioContext = null;
function getAudioContext() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}

function playActivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}
function playDeactivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.setValueAtTime(330, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}
function playSyncSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext(); const now = ctx.currentTime;
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(600, now); osc1.frequency.setValueAtTime(900, now + 0.05); osc1.frequency.setValueAtTime(1200, now + 0.1);
        gain1.gain.setValueAtTime(0.3, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc1.start(now); osc1.stop(now + 0.15);
        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(800, now + 0.06); osc2.frequency.setValueAtTime(1200, now + 0.12);
        gain2.gain.setValueAtTime(0.2, now + 0.06); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc2.start(now + 0.06); osc2.stop(now + 0.18);
    } catch(e) {}
}
function playNavSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, ctx.currentTime); osc.frequency.setValueAtTime(700, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
}
function playSearchSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.setValueAtTime(800, ctx.currentTime + 0.06); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.25, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}
function playTodaySound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.05); osc.frequency.setValueAtTime(900, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
}

function showSync(message, isError = false) {
    const el = document.getElementById('syncStatus');
    el.textContent = message;
    el.className = 'sync-indicator ' + (isError ? 'error' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
}

async function loadFromCloud() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const result = await response.json();
        allData = result.record || {};
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        return allData;
    } catch (e) {
        const local = localStorage.getItem('deliveryCloudData');
        if (local) allData = JSON.parse(local);
        return allData;
    }
}

async function saveToCloud() {
    if (!localChanges) return;
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
            body: JSON.stringify(allData)
        });
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        showSync('☁️ Синхронизировано');
    } catch (e) {
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        showSync('📱 Офлайн — сохранено локально', true);
    }
}

function saveCellLocal(dateStr, row, col, value) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr][row]) allData[dateStr][row] = {};
    allData[dateStr][row][col] = value;
    localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
    localChanges = true;
}

function saveRowTime(dateStr, row, time) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr]['_rowTimes']) allData[dateStr]['_rowTimes'] = {};
    if (!allData[dateStr]['_rowTimes'][row]) {
        allData[dateStr]['_rowTimes'][row] = time;
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = true;
    }
}

function getRowTime(dateStr, row) {
    if (allData[dateStr] && allData[dateStr]['_rowTimes'] && allData[dateStr]['_rowTimes'][row]) {
        return allData[dateStr]['_rowTimes'][row];
    }
    return '';
}

function getCell(dateStr, row, col) {
    if (allData[dateStr] && allData[dateStr][row]) {
        return allData[dateStr][row][col] || '';
    }
    return '';
}

function formatDate(date) {
    return `${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}`;
}

function getToday() { return formatDate(new Date()); }

function shiftDate(ds, off) {
    const p = ds.split('.');
    const d = new Date(+p[2], +p[1]-1, +p[0]);
    d.setDate(d.getDate() + off);
    return formatDate(d);
}

function getNowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function prevDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    await goToDate(shiftDate(currentDateStr, -1));
    setTimeout(() => isSwitching = false, 120);
}
async function nextDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    await goToDate(shiftDate(currentDateStr, 1));
    setTimeout(() => isSwitching = false, 120);
}
async function goToday() { playTodaySound(); await goToDate(getToday()); }
async function searchDate() {
    const v = document.getElementById('searchDateInput').value.trim();
    if (v && /^\d{2}\.\d{2}\.\d{4}$/.test(v)) { playSearchSound(); await goToDate(v); }
    else { alert('Формат: дд.мм.гггг'); }
}

function updateTotals() {
    let main = 0, c5 = 0, c6 = 0;
    document.querySelectorAll('.heart-cell').forEach(cell => {
        if (cell.classList.contains('active')) main += +cell.dataset.col === 1 ? 155 : 85;
    });
    document.querySelectorAll('input[data-col]').forEach(inp => {
        const col = +inp.dataset.col;
        const v = parseFloat(inp.value.replace(',','.')) || 0;
        if (col === 5) { c5 += v; main += v * 13; }
        else if (col === 6) { c6 += v; main += v * 2; }
        else if (col === 7) { main += v; }
    });
    const mainEl = document.getElementById('totalMain');
    const c5El = document.getElementById('totalCol5');
    const c6El = document.getElementById('totalCol6');
    if (previousTotals.main !== main) { mainEl.classList.remove('changed'); void mainEl.offsetWidth; mainEl.classList.add('changed'); }
    if (previousTotals.col5 !== c5) { c5El.classList.remove('changed'); void c5El.offsetWidth; c5El.classList.add('changed'); }
    if (previousTotals.col6 !== c6) { c6El.classList.remove('changed'); void c6El.offsetWidth; c6El.classList.add('changed'); }
    mainEl.textContent = main; c5El.textContent = c5; c6El.textContent = c6;
    previousTotals = { main, col5: c5, col6: c6 };
}

function updateStats() {
    if (!currentDateStr) return;
    const parts = currentDateStr.split('.');
    const month = parts[1]; const year = parts[2];
    let totalMain = 0, totalKM = 0, totalKG = 0;
    for (const dateKey in allData) {
        if (dateKey.startsWith('_')) continue;
        const dp = dateKey.split('.');
        if (dp.length === 3 && dp[1] === month && dp[2] === year) {
            const dayData = allData[dateKey];
            for (const row in dayData) {
                if (row.startsWith('_')) continue;
                for (const col in dayData[row]) {
                    const val = dayData[row][col];
                    if (col === '1' && val === '1') totalMain += 155;
                    else if ((col === '2' || col === '3' || col === '4') && val === '1') totalMain += 85;
                    else if (col === '5') { const v = parseFloat(val) || 0; totalKM += v; totalMain += v * 13; }
                    else if (col === '6') { const v = parseFloat(val) || 0; totalKG += v; totalMain += v * 2; }
                    else if (col === '7') { const v = parseFloat(val) || 0; totalMain += v; }
                }
            }
        }
    }
    document.getElementById('statTotal').textContent = totalMain;
    document.getElementById('statKM').textContent = totalKM;
    document.getElementById('statKG').textContent = totalKG;
}

function renderTable(dateStr) {
    document.getElementById('currentDateDisplay').textContent = dateStr;
    document.getElementById('searchDateInput').value = dateStr;
    const display = document.getElementById('currentDateDisplay');
    if (dateStr === getToday()) { display.classList.add('today-highlight'); }
    else { display.classList.remove('today-highlight'); }
    
    let h = '';
    for (let i = 1; i <= 100; i++) {
        const a1 = getCell(dateStr, i, 1) === '1';
        const a2 = getCell(dateStr, i, 2) === '1';
        const a3 = getCell(dateStr, i, 3) === '1';
        const a4 = getCell(dateStr, i, 4) === '1';
        const v5 = getCell(dateStr, i, 5).replace(/"/g,'&quot;');
        const v6 = getCell(dateStr, i, 6).replace(/"/g,'&quot;');
        const v7 = getCell(dateStr, i, 7).replace(/"/g,'&quot;');
        const rowTime = getRowTime(dateStr, i);

        h += `<tr>
            <td class="row-time">${rowTime}</td>
            <td class="row-number">${i}</td>
            <td><div class="heart-cell${a1?' active':''}" data-row="${i}" data-col="1">💵</div></td>
            <td><div class="heart-cell${a2?' active':''}" data-row="${i}" data-col="2">💷</div></td>
            <td><div class="heart-cell${a3?' active':''}" data-row="${i}" data-col="3">💴</div></td>
            <td><div class="heart-cell${a4?' active':''}" data-row="${i}" data-col="4">💶</div></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="5" value="${v5}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="6" value="${v6}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="7" value="${v7}" placeholder="0"></td>
        </tr>`;
    }
    document.getElementById('rowsBody').innerHTML = h;

    document.querySelectorAll('.heart-cell').forEach(cell => {
        cell.onclick = () => {
            const isActive = cell.classList.contains('active');
            const row = cell.dataset.row;
            if (isActive) {
                cell.classList.remove('active');
                saveCellLocal(dateStr, row, cell.dataset.col, '0');
                playDeactivateSound();
            } else {
                cell.classList.add('active');
                const time = getNowTime();
                saveRowTime(dateStr, row, time);
                saveCellLocal(dateStr, row, cell.dataset.col, '1');
                document.querySelector(`tr:nth-child(${row}) .row-time`).textContent = time;
                playActivateSound();
            }
            updateTotals();
            if (statsVisible) updateStats();
        };
    });

    document.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => {
            const row = inp.dataset.row;
            const time = getNowTime();
            saveRowTime(dateStr, row, time);
            saveCellLocal(dateStr, row, inp.dataset.col, inp.value);
            const timeCell = document.querySelector(`tr:nth-child(${row}) .row-time`);
            if (!timeCell.textContent.trim()) timeCell.textContent = time;
            updateTotals();
            if (statsVisible) updateStats();
        };
    });

    updateTotals();
    if (statsVisible) updateStats();
}

async function goToDate(ds) { currentDateStr = ds; renderTable(ds); }

async function syncNow() {
    playSyncSound();
    showSync('🔄 Синхронизация...');
    await saveToCloud();
    await loadFromCloud();
    if (currentDateStr) renderTable(currentDateStr);
}

function toggleStats() {
    const popup = document.getElementById('statsPopup');
    statsVisible = !statsVisible;
    if (statsVisible) {
        popup.classList.add('show');
        updateStats();
    } else {
        popup.classList.remove('show');
    }
}

(async function init() {
    await loadFromCloud();
    
    const today = getToday();
    currentDateStr = today;
    renderTable(today);
    
    setInterval(async () => {
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    }, 18000000);
    
    document.getElementById('prevDayBtn').onclick = prevDay;
    document.getElementById('nextDayBtn').onclick = nextDay;
    document.getElementById('todayBtn').onclick = goToday;
    document.getElementById('searchDateBtn').onclick = searchDate;
    document.getElementById('syncBtn').onclick = syncNow;
    document.getElementById('soundToggle').onclick = toggleSound;
    document.getElementById('statsBtn').onclick = toggleStats;
    document.getElementById('searchDateInput').onkeypress = e => { if (e.key === 'Enter') searchDate(); };
    document.getElementById('currentDateDisplay').onclick = () => { document.getElementById('searchDateInput').focus(); };
    
    window.addEventListener('beforeunload', () => { saveToCloud(); });
    window.addEventListener('online', async () => {
        showSync('🌐 Онлайн — синхронизируем...');
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    });
    window.addEventListener('offline', () => { showSync('📱 Офлайн-режим', true); });
})();
</script>

<script>
const JSONBIN_BIN_ID = '6a750d49da38895dfec37959';
const JSONBIN_API_KEY = '$2a$10$Aaqly4jYya2FH7JO0vhA9OsX0D1ufyWm1QZCTAQty6OQzyvdDcPfO';

let currentDateStr = '';
let allData = {};
let localChanges = false;
let soundEnabled = true;
let isSwitching = false;
let statsVisible = false;

document.addEventListener('touchstart', function(){}, {passive: false});

let audioContext = null;
function getAudioContext() {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    return audioContext;
}

function playActivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}
function playDeactivateSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.setValueAtTime(330, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}
function playSyncSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext(); const now = ctx.currentTime;
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(600, now); osc1.frequency.setValueAtTime(900, now + 0.04); osc1.frequency.setValueAtTime(1200, now + 0.08);
        gain1.gain.setValueAtTime(0.3, now); gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc1.start(now); osc1.stop(now + 0.12);
        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(800, now + 0.04); osc2.frequency.setValueAtTime(1200, now + 0.1);
        gain2.gain.setValueAtTime(0.2, now + 0.04); gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
        osc2.start(now + 0.04); osc2.stop(now + 0.14);
    } catch(e) {}
}
function playNavSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, ctx.currentTime); osc.frequency.setValueAtTime(700, ctx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
}
function playSearchSound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.setValueAtTime(800, ctx.currentTime + 0.04); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}
function playTodaySound() {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.04); osc.frequency.setValueAtTime(900, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
}

function showSync(message, isError = false) {
    const el = document.getElementById('syncStatus');
    el.textContent = message;
    el.className = 'sync-indicator ' + (isError ? 'error' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1200);
}

async function loadFromCloud() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const result = await response.json();
        allData = result.record || {};
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        return allData;
    } catch (e) {
        const local = localStorage.getItem('deliveryCloudData');
        if (local) allData = JSON.parse(local);
        return allData;
    }
}

async function saveToCloud() {
    if (!localChanges) return;
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
            body: JSON.stringify(allData)
        });
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        showSync('☁️ Синхронизировано');
    } catch (e) {
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        showSync('📱 Офлайн — сохранено локально', true);
    }
}

function formatNumber(value) {
    if (value === '' || value === null || value === undefined) return '';
    const num = parseFloat(String(value).replace(',', '.'));
    if (isNaN(num)) return '';
    return parseFloat(num.toFixed(2));
}

function saveCellLocal(dateStr, row, col, value) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr][row]) allData[dateStr][row] = {};
    
    if (col === '5' || col === '6' || col === '7') {
        const formatted = formatNumber(value);
        allData[dateStr][row][col] = formatted !== '' ? formatted : value;
    } else {
        allData[dateStr][row][col] = value;
    }
    
    localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
    localChanges = true;
}

function saveRowTime(dateStr, row, time) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr]['_rowTimes']) allData[dateStr]['_rowTimes'] = {};
    allData[dateStr]['_rowTimes'][row] = time;
    localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
    localChanges = true;
}

function getRowTime(dateStr, row) {
    if (allData[dateStr] && allData[dateStr]['_rowTimes'] && allData[dateStr]['_rowTimes'][row]) {
        return allData[dateStr]['_rowTimes'][row];
    }
    return '';
}

function getCell(dateStr, row, col) {
    if (allData[dateStr] && allData[dateStr][row]) {
        const val = allData[dateStr][row][col];
        if (col === '5' || col === '6' || col === '7') {
            return val !== undefined && val !== '' ? val : '';
        }
        return val || '';
    }
    return '';
}

function formatDate(date) {
    return `${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}`;
}

function getToday() { return formatDate(new Date()); }

function shiftDate(ds, off) {
    const p = ds.split('.');
    const d = new Date(+p[2], +p[1]-1, +p[0]);
    d.setDate(d.getDate() + off);
    return formatDate(d);
}

function getNowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function updateRowTimeInTable(row, time) {
    const timeCell = document.querySelector(`tr:nth-child(${row}) .row-time`);
    if (timeCell) timeCell.textContent = time;
}

function prevDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    currentDateStr = shiftDate(currentDateStr, -1);
    renderTable(currentDateStr);
    setTimeout(() => isSwitching = false, 50);
}

function nextDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    currentDateStr = shiftDate(currentDateStr, 1);
    renderTable(currentDateStr);
    setTimeout(() => isSwitching = false, 50);
}

function goToday() {
    playTodaySound();
    currentDateStr = getToday();
    renderTable(currentDateStr);
}

function searchDate() {
    const v = document.getElementById('searchDateInput').value.trim();
    if (v && /^\d{2}\.\d{2}\.\d{4}$/.test(v)) { 
        playSearchSound(); 
        currentDateStr = v;
        renderTable(currentDateStr);
    } else { 
        alert('Формат: дд.мм.гггг'); 
    }
}

function isRowActive(row) {
    for (let col = 1; col <= 7; col++) {
        const val = getCell(currentDateStr, row, String(col));
        if (col <= 4) {
            if (val === '1') return true;
        } else {
            if (val && val !== '0' && val !== '') return true;
        }
    }
    return false;
}

function updateRowHighlight(row) {
    const tr = document.querySelector(`tr:nth-child(${row})`);
    if (!tr) return;
    
    if (isRowActive(row)) {
        tr.classList.add('row-active');
    } else {
        tr.classList.remove('row-active');
    }
}

function updateTotals() {
    let main = 0, c5 = 0, c6 = 0;
    document.querySelectorAll('.heart-cell').forEach(cell => {
        if (cell.classList.contains('active')) main += +cell.dataset.col === 1 ? 155 : 85;
    });
    document.querySelectorAll('input[data-col]').forEach(inp => {
        const col = +inp.dataset.col;
        const v = parseFloat(inp.value.replace(',','.')) || 0;
        if (col === 5) { 
            c5 += v; 
            main += v * 13; 
        }
        else if (col === 6) { 
            c6 += v; 
            main += v * 2; 
        }
        else if (col === 7) { 
            main += v; 
        }
    });
    document.getElementById('totalMain').textContent = parseFloat(main.toFixed(2));
    document.getElementById('totalCol5').textContent = parseFloat(c5.toFixed(2));
    document.getElementById('totalCol6').textContent = parseFloat(c6.toFixed(2));
}

function updateStats() {
    if (!currentDateStr) return;
    const parts = currentDateStr.split('.');
    const month = parts[1]; const year = parts[2];
    let totalMain = 0, totalKM = 0, totalKG = 0;
    for (const dateKey in allData) {
        if (dateKey.startsWith('_')) continue;
        const dp = dateKey.split('.');
        if (dp.length === 3 && dp[1] === month && dp[2] === year) {
            const dayData = allData[dateKey];
            for (const row in dayData) {
                if (row.startsWith('_')) continue;
                for (const col in dayData[row]) {
                    const val = dayData[row][col];
                    if (col === '1' && val === '1') totalMain += 155;
                    else if ((col === '2' || col === '3' || col === '4') && val === '1') totalMain += 85;
                    else if (col === '5') { const v = parseFloat(val) || 0; totalKM += v; totalMain += v * 13; }
                    else if (col === '6') { const v = parseFloat(val) || 0; totalKG += v; totalMain += v * 2; }
                    else if (col === '7') { const v = parseFloat(val) || 0; totalMain += v; }
                }
            }
        }
    }
    document.getElementById('statTotal').textContent = parseFloat(totalMain.toFixed(2));
    document.getElementById('statKM').textContent = parseFloat(totalKM.toFixed(2));
    document.getElementById('statKG').textContent = parseFloat(totalKG.toFixed(2));
}

let scrollPosition = 0;

function renderTable(dateStr) {
    const wrapper = document.getElementById('tableWrapper');
    if (wrapper) scrollPosition = wrapper.scrollTop;
    
    document.getElementById('currentDateDisplay').textContent = dateStr;
    document.getElementById('searchDateInput').value = dateStr;
    const display = document.getElementById('currentDateDisplay');
    if (dateStr === getToday()) { display.classList.add('today-highlight'); }
    else { display.classList.remove('today-highlight'); }
    
    let h = '';
    for (let i = 1; i <= 100; i++) {
        const a1 = getCell(dateStr, i, 1) === '1';
        const a2 = getCell(dateStr, i, 2) === '1';
        const a3 = getCell(dateStr, i, 3) === '1';
        const a4 = getCell(dateStr, i, 4) === '1';
        const v5 = getCell(dateStr, i, 5);
        const v6 = getCell(dateStr, i, 6);
        const v7 = getCell(dateStr, i, 7);
        const rowTime = getRowTime(dateStr, i);
        
        const rowActive = (a1 || a2 || a3 || a4 || 
                          (v5 && v5 !== '0') || 
                          (v6 && v6 !== '0') || 
                          (v7 && v7 !== '0'));

        h += `<tr class="${rowActive ? 'row-active' : ''}">
            <td class="row-time">${rowTime}</td>
            <td class="row-number">${i}</td>
            <td><div class="heart-cell${a1?' active':''}" data-row="${i}" data-col="1">💵</div></td>
            <td><div class="heart-cell${a2?' active':''}" data-row="${i}" data-col="2">💷</div></td>
            <td><div class="heart-cell${a3?' active':''}" data-row="${i}" data-col="3">💴</div></td>
            <td><div class="heart-cell${a4?' active':''}" data-row="${i}" data-col="4">💶</div></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="5" value="${v5}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="6" value="${v6}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="7" value="${v7}" placeholder="0"></td>
        </tr>`;
    }
    document.getElementById('rowsBody').innerHTML = h;

    if (wrapper) {
        requestAnimationFrame(() => {
            wrapper.scrollTop = scrollPosition;
        });
    }

    document.querySelectorAll('.heart-cell').forEach(cell => {
        cell.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const isActive = this.classList.contains('active');
            const row = this.dataset.row;
            const time = getNowTime();
            if (isActive) {
                this.classList.remove('active');
                saveCellLocal(dateStr, row, this.dataset.col, '0');
                playDeactivateSound();
            } else {
                this.classList.add('active');
                saveCellLocal(dateStr, row, this.dataset.col, '1');
                playActivateSound();
            }
            saveRowTime(dateStr, row, time);
            updateRowTimeInTable(row, time);
            updateRowHighlight(row);
            updateTotals();
            if (statsVisible) updateStats();
        });
    });

    document.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', function() {
            const row = this.dataset.row;
            const col = this.dataset.col;
            const time = getNowTime();
            let val = this.value;
            
            if (col === '5' || col === '6' || col === '7') {
                const formatted = formatNumber(val);
                if (formatted !== '' && formatted !== val) {
                    const cursorPos = this.selectionStart;
                    this.value = formatted;
                    this.setSelectionRange(cursorPos, cursorPos);
                }
                saveCellLocal(dateStr, row, col, formatted !== '' ? formatted : val);
            } else {
                saveCellLocal(dateStr, row, col, val);
            }
            
            saveRowTime(dateStr, row, time);
            updateRowTimeInTable(row, time);
            updateRowHighlight(row);
            updateTotals();
            if (statsVisible) updateStats();
        });
    });

    updateTotals();
    if (statsVisible) updateStats();
}

function syncNow() {
    playSyncSound();
    showSync('🔄 Синхронизация...');
    saveToCloud();
    loadFromCloud().then(() => {
        if (currentDateStr) renderTable(currentDateStr);
    });
}

function toggleStats() {
    const popup = document.getElementById('statsPopup');
    statsVisible = !statsVisible;
    if (statsVisible) {
        popup.classList.add('show');
        updateStats();
    } else {
        popup.classList.remove('show');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        const prevBtn = document.getElementById('prevDayBtn');
        const nextBtn = document.getElementById('nextDayBtn');
        const todayBtn = document.getElementById('todayBtn');
        const searchBtn = document.getElementById('searchDateBtn');
        const syncBtn = document.getElementById('syncBtn');
        const statsBtn = document.getElementById('statsBtn');
        const soundBtn = document.getElementById('soundToggle');
        const dateDisplay = document.getElementById('currentDateDisplay');
        
        if (prevBtn) prevBtn.addEventListener('touchstart', (e) => { e.preventDefault(); prevDay(); });
        if (nextBtn) nextBtn.addEventListener('touchstart', (e) => { e.preventDefault(); nextDay(); });
        if (todayBtn) todayBtn.addEventListener('touchstart', (e) => { e.preventDefault(); goToday(); });
        if (searchBtn) searchBtn.addEventListener('touchstart', (e) => { e.preventDefault(); searchDate(); });
        if (syncBtn) syncBtn.addEventListener('touchstart', (e) => { e.preventDefault(); syncNow(); });
        if (statsBtn) statsBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleStats(); });
        if (soundBtn) soundBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleSound(); });
        if (dateDisplay) dateDisplay.addEventListener('touchstart', (e) => { e.preventDefault(); document.getElementById('searchDateInput').focus(); });
    }, 100);
});

document.addEventListener('focusin', function(e) {
    if (e.target.tagName === 'INPUT') {
        setTimeout(() => {
            e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 300);
    }
});

(async function init() {
    await loadFromCloud();
    
    const today = getToday();
    currentDateStr = today;
    renderTable(today);
    
    setInterval(async () => {
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    }, 18000000);
    
    document.getElementById('searchDateInput').onkeypress = e => { if (e.key === 'Enter') searchDate(); };
    
    window.addEventListener('beforeunload', () => { saveToCloud(); });
    window.addEventListener('online', async () => {
        showSync('🌐 Онлайн — синхронизируем...');
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    });
    window.addEventListener('offline', () => { showSync('📱 Офлайн-режим', true); });
})();
</script>
</body>

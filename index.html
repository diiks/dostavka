        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
}

function showSync(message, isError = false) {
    const el = document.getElementById('syncStatus');
    el.textContent = message;
    el.className = 'sync-indicator ' + (isError ? 'error' : '');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1500);
}

async function loadFromCloud() {
    try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
            headers: { 'X-Master-Key': JSONBIN_API_KEY }
        });
        const result = await response.json();
        allData = result.record || {};
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        return allData;
    } catch (e) {
        const local = localStorage.getItem('deliveryCloudData');
        if (local) allData = JSON.parse(local);
        return allData;
    }
}

async function saveToCloud() {
    if (!localChanges) return;
    try {
        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
            body: JSON.stringify(allData)
        });
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        localChanges = false;
        showSync('☁️ Синхронизировано');
    } catch (e) {
        localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
        showSync('📱 Офлайн — сохранено локально', true);
    }
}

function saveCellLocal(dateStr, row, col, value, time = null) {
    if (!allData[dateStr]) allData[dateStr] = {};
    if (!allData[dateStr][row]) allData[dateStr][row] = {};
    allData[dateStr][row][col] = value;
    if (time && col >= 1 && col <= 4) {
        allData[dateStr][row][col + '_time'] = time;
    }
    localStorage.setItem('deliveryCloudData', JSON.stringify(allData));
    localChanges = true;
}

function getCell(dateStr, row, col) {
    if (allData[dateStr] && allData[dateStr][row]) {
        return allData[dateStr][row][col] || '';
    }
    return '';
}

function getCellTime(dateStr, row, col) {
    if (allData[dateStr] && allData[dateStr][row]) {
        return allData[dateStr][row][col + '_time'] || '';
    }
    return '';
}

function formatDate(date) {
    return `${String(date.getDate()).padStart(2,'0')}.${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}`;
}

function getToday() { return formatDate(new Date()); }

function shiftDate(ds, off) {
    const p = ds.split('.');
    const d = new Date(+p[2], +p[1]-1, +p[0]);
    d.setDate(d.getDate() + off);
    return formatDate(d);
}

function getNowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Вибрация
function vibrate() {
    if (navigator.vibrate) navigator.vibrate(10);
}

async function prevDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    vibrate();
    await goToDate(shiftDate(currentDateStr, -1));
    setTimeout(() => isSwitching = false, 120);
}

async function nextDay() {
    if (isSwitching) return;
    isSwitching = true;
    playNavSound();
    vibrate();
    await goToDate(shiftDate(currentDateStr, 1));
    setTimeout(() => isSwitching = false, 120);
}

async function goToday() {
    playTodaySound();
    vibrate();
    await goToDate(getToday());
}

async function searchDate() {
    const v = document.getElementById('searchDateInput').value.trim();
    if (v && /^\d{2}\.\d{2}\.\d{4}$/.test(v)) {
        playSearchSound();
        vibrate();
        await goToDate(v);
    } else {
        alert('Формат: дд.мм.гггг');
    }
}

function updateTotals() {
    let main = 0, c5 = 0, c6 = 0;
    
    document.querySelectorAll('.heart-cell').forEach(cell => {
        if (cell.classList.contains('active')) {
            main += +cell.dataset.col === 1 ? 155 : 85;
        }
    });

    document.querySelectorAll('input[data-col]').forEach(inp => {
        const col = +inp.dataset.col;
        const v = parseFloat(inp.value.replace(',','.')) || 0;
        if (col === 5) { c5 += v; main += v * 13; }
        else if (col === 6) { c6 += v; main += v * 2; }
        else if (col === 7) { main += v; }
    });

    // Анимация изменения
    const mainEl = document.getElementById('totalMain');
    const c5El = document.getElementById('totalCol5');
    const c6El = document.getElementById('totalCol6');
    
    if (previousTotals.main !== main) {
        mainEl.classList.remove('changed');
        void mainEl.offsetWidth;
        mainEl.classList.add('changed');
    }
    if (previousTotals.col5 !== c5) {
        c5El.classList.remove('changed');
        void c5El.offsetWidth;
        c5El.classList.add('changed');
    }
    if (previousTotals.col6 !== c6) {
        c6El.classList.remove('changed');
        void c6El.offsetWidth;
        c6El.classList.add('changed');
    }

    mainEl.textContent = main;
    c5El.textContent = c5;
    c6El.textContent = c6;
    
    previousTotals = { main, col5: c5, col6: c6 };
}

function updateMonthProgress() {
    if (!currentDateStr) return;
    const parts = currentDateStr.split('.');
    const month = parts[1];
    const year = parts[2];
    let filledDays = 0;
    
    for (const dateKey in allData) {
        const dp = dateKey.split('.');
        if (dp[1] === month && dp[2] === year) {
            const dayData = allData[dateKey];
            let hasData = false;
            for (const row in dayData) {
                for (const col in dayData[row]) {
                    const val = dayData[row][col];
                    if (val && val !== '0' && val !== '') { hasData = true; break; }
                }
                if (hasData) break;
            }
            if (hasData) filledDays++;
        }
    }
    
    const totalDays = new Date(+year, +month, 0).getDate();
    const percent = Math.round((filledDays / totalDays) * 100);
    document.getElementById('monthProgress').style.width = percent + '%';
}

function updateStats() {
    if (!currentDateStr) return;
    const parts = currentDateStr.split('.');
    const month = parts[1];
    const year = parts[2];
    
    let totalMain = 0, totalKM = 0, totalKG = 0, filledDays = 0;
    
    for (const dateKey in allData) {
        const dp = dateKey.split('.');
        if (dp[1] === month && dp[2] === year) {
            const dayData = allData[dateKey];
            let dayMain = 0, dayKM = 0, dayKG = 0;
            let hasData = false;
            
            for (const row in dayData) {
                for (const col in dayData[row]) {
                    if (col.includes('_time')) continue;
                    const val = dayData[row][col];
                    if (col === '1' && val === '1') { dayMain += 155; hasData = true; }
                    else if ((col === '2' || col === '3' || col === '4') && val === '1') { dayMain += 85; hasData = true; }
                    else if (col === '5') { const v = parseFloat(val) || 0; dayKM += v; dayMain += v * 13; if (v) hasData = true; }
                    else if (col === '6') { const v = parseFloat(val) || 0; dayKG += v; dayMain += v * 2; if (v) hasData = true; }
                    else if (col === '7') { const v = parseFloat(val) || 0; dayMain += v; if (v) hasData = true; }
                }
            }
            
            if (hasData) {
                totalMain += dayMain;
                totalKM += dayKM;
                totalKG += dayKG;
                filledDays++;
            }
        }
    }
    
    document.getElementById('statTotal').textContent = totalMain;
    document.getElementById('statKM').textContent = totalKM;
    document.getElementById('statKG').textContent = totalKG;
    document.getElementById('statDays').textContent = filledDays;
}

function renderTable(dateStr) {
    document.getElementById('currentDateDisplay').textContent = dateStr;
    document.getElementById('searchDateInput').value = dateStr;
    
    // Подсветка сегодня
    const display = document.getElementById('currentDateDisplay');
    if (dateStr === getToday()) {
        display.classList.add('today-highlight');
    } else {
        display.classList.remove('today-highlight');
    }
    
    let h = '';
    for (let i = 1; i <= 100; i++) {
        const a1 = getCell(dateStr, i, 1) === '1';
        const a2 = getCell(dateStr, i, 2) === '1';
        const a3 = getCell(dateStr, i, 3) === '1';
        const a4 = getCell(dateStr, i, 4) === '1';
        const t1 = getCellTime(dateStr, i, 1);
        const t2 = getCellTime(dateStr, i, 2);
        const t3 = getCellTime(dateStr, i, 3);
        const t4 = getCellTime(dateStr, i, 4);
        const v5 = getCell(dateStr, i, 5).replace(/"/g,'&quot;');
        const v6 = getCell(dateStr, i, 6).replace(/"/g,'&quot;');
        const v7 = getCell(dateStr, i, 7).replace(/"/g,'&quot;');

        h += `<tr>
            <td class="row-number">${i}</td>
            <td><div class="heart-cell${a1?' active':''}" data-row="${i}" data-col="1">💵<span class="time-stamp">${t1}</span></div></td>
            <td><div class="heart-cell${a2?' active':''}" data-row="${i}" data-col="2">💷<span class="time-stamp">${t2}</span></div></td>
            <td><div class="heart-cell${a3?' active':''}" data-row="${i}" data-col="3">💴<span class="time-stamp">${t3}</span></div></td>
            <td><div class="heart-cell${a4?' active':''}" data-row="${i}" data-col="4">💶<span class="time-stamp">${t4}</span></div></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="5" value="${v5}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="6" value="${v6}" placeholder="0"></td>
            <td><input type="text" inputmode="decimal" data-row="${i}" data-col="7" value="${v7}" placeholder="0"></td>
        </tr>`;
    }

    document.getElementById('rowsBody').innerHTML = h;

    document.querySelectorAll('.heart-cell').forEach(cell => {
        cell.onclick = () => {
            const isActive = cell.classList.contains('active');
            vibrate();
            if (isActive) {
                cell.classList.remove('active');
                saveCellLocal(dateStr, cell.dataset.row, cell.dataset.col, '0');
                cell.querySelector('.time-stamp').textContent = '';
                playDeactivateSound();
            } else {
                cell.classList.add('active');
                const time = getNowTime();
                saveCellLocal(dateStr, cell.dataset.row, cell.dataset.col, '1', time);
                cell.querySelector('.time-stamp').textContent = time;
                playActivateSound();
            }
            updateTotals();
            updateMonthProgress();
            updateStats();
        };
    });

    document.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => {
            saveCellLocal(dateStr, inp.dataset.row, inp.dataset.col, inp.value);
            updateTotals();
            updateMonthProgress();
            updateStats();
        };
    });

    updateTotals();
    updateMonthProgress();
    updateStats();
}

async function goToDate(ds) {
    currentDateStr = ds;
    renderTable(ds);
}

async function syncNow() {
    playSyncSound();
    vibrate();
    showSync('🔄 Синхронизация...');
    await saveToCloud();
    await loadFromCloud();
    if (currentDateStr) renderTable(currentDateStr);
}

(async function init() {
    await loadFromCloud();
    
    // Скрываем сплеш-скрин
    setTimeout(() => {
        document.getElementById('splashScreen').classList.add('hidden');
    }, 1500);
    
    const today = getToday();
    currentDateStr = today;
    renderTable(today);
    
    setInterval(async () => {
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    }, 18000000);
    
    document.getElementById('prevDayBtn').onclick = prevDay;
    document.getElementById('nextDayBtn').onclick = nextDay;
    document.getElementById('todayBtn').onclick = goToday;
    document.getElementById('searchDateBtn').onclick = searchDate;
    document.getElementById('syncBtn').onclick = syncNow;
    document.getElementById('soundToggle').onclick = toggleSound;
    
    document.getElementById('statsBtn').onclick = () => {
        const panel = document.getElementById('statsPanel');
        panel.classList.toggle('show');
        if (panel.classList.contains('show')) updateStats();
    };
    
    document.getElementById('searchDateInput').onkeypress = e => {
        if (e.key === 'Enter') searchDate();
    };
    document.getElementById('currentDateDisplay').onclick = () => {
        document.getElementById('searchDateInput').focus();
    };
    
    window.addEventListener('beforeunload', () => { saveToCloud(); });
    window.addEventListener('online', async () => {
        showSync('🌐 Онлайн — синхронизируем...');
        await saveToCloud();
        await loadFromCloud();
        if (currentDateStr) renderTable(currentDateStr);
    });
    window.addEventListener('offline', () => { showSync('📱 Офлайн-режим', true); });
})();
</script>
</body>
